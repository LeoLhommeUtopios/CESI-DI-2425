<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accueil</title>
</head>

<body>
<span th:replace="~{home :: navBar}"></span>
 <h1>Detail de l'etudiant</h1>
<div>
    <p>id : <span th:text="${student.getId()}"></span></p>
    <p>Nom : <span th:text="${student.getLastname()}"></span></p>
    <p>Prenom : <span th:text="${student.getFirstname()}"></span></p>
    <p>Age : <span th:text="${student.getAge()}"></span></p>
    <p>Email : <span th:text="${student.getEmail()}"></span></p>
</div>

</body>
</html>
