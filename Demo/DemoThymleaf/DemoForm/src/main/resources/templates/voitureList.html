<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>list Voiture</title>
</head>

<body>
    <span th:replace="~{home :: navBar}"></span>
    <h1>Liste des voitures :</h1>
    <div>
        <ul th:unless="${voitures.isEmpty()}">
            <li th:each="v : ${voitures}">
                <a th:href="@{/voiture/{id}(id=${v.getId()})}">details</a>
                <span th:text="${v.getModel()}"></span>
            </li>
        </ul>
    </div>
    <a th:href="@{/add}">Ajouter une voiture</a>
</body>
</html>
